<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dev Crew AI onboarding flow</title>
  <desc id="desc">Choose GitHub repo, local Git repo, or plain folder, then scan, detect project vision, initialize Git if needed, and create the first lane.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1200" height="520" rx="36" fill="#0f172a"/>
  <text x="56" y="70" fill="#e5eefb" font-family="Segoe UI, Arial" font-size="34" font-weight="800">Add Project Wizard</text>
  <text x="56" y="106" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">GitHub, local Git, or plain folder — always local-first and Git-safe.</text>
  <g font-family="Segoe UI, Arial">
    <rect x="56" y="160" width="260" height="140" rx="22" fill="#1e293b" stroke="#22d3ee"/>
    <text x="84" y="205" fill="#e0f2fe" font-size="22" font-weight="800">GitHub repo</text>
    <text x="84" y="240" fill="#94a3b8" font-size="16">Issues, PRs, CI, remotes</text>
    <text x="84" y="270" fill="#bae6fd" font-size="15" font-weight="700">Create lanes from issues</text>
    <rect x="56" y="330" width="260" height="112" rx="22" fill="#1e293b" stroke="#34d399"/>
    <text x="84" y="374" fill="#d1fae5" font-size="22" font-weight="800">Local Git repo</text>
    <text x="84" y="408" fill="#94a3b8" font-size="16">Branches + worktrees</text>
    <rect x="350" y="330" width="260" height="112" rx="22" fill="#1e293b" stroke="#fbbf24"/>
    <text x="378" y="374" fill="#fef3c7" font-size="22" font-weight="800">Plain folder</text>
    <text x="378" y="408" fill="#94a3b8" font-size="16">Initialize Git first</text>
    <path d="M330 230 L442 230" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M620 230 L732 230" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M905 230 L1015 230" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="440" y="160" width="190" height="140" rx="22" fill="#172554" stroke="#38bdf8"/>
    <text x="472" y="218" fill="#e0f2fe" font-size="24" font-weight="800">Scan</text>
    <text x="472" y="252" fill="#bfdbfe" font-size="16">Stack, branch, Git</text>
    <rect x="730" y="160" width="205" height="140" rx="22" fill="#312e81" stroke="#a78bfa"/>
    <text x="760" y="218" fill="#ede9fe" font-size="24" font-weight="800">Project Vision</text>
    <text x="760" y="252" fill="#c4b5fd" font-size="16">VISION.md / AGENTS.md</text>
    <rect x="1010" y="160" width="145" height="140" rx="22" fill="#14532d" stroke="#4ade80"/>
    <text x="1038" y="218" fill="#dcfce7" font-size="24" font-weight="800">Lane</text>
    <text x="1038" y="252" fill="#bbf7d0" font-size="16">Ready safely</text>
  </g>
</svg>
